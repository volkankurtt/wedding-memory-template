name: Render Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render backend
        run: |
          curl --fail \
               --retry 3 \
               --retry-delay 5 \
               --max-time 60 \
               https://dugun-anisi-backend.onrender.com/api/health
