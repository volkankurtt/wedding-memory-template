spring:
  application:
    name: dugun-anisi
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
   enabled: true
   locations: classpath:db/migration
   baseline-on-migrate: true
   baseline-version: 0

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    token: ${ADMIN_TOKEN:}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:guest-photos}
    public-storage-base-url: ${SUPABASE_PUBLIC_STORAGE_BASE_URL:}
  imagemagick:
    command: ${MAGICK_COMMAND:magick}
  rate-limit:
    photo-uploads-per-window: 60
    memory-posts-per-window: 20
    window: 10m
  client-ip:
    # Only honor X-Forwarded-For when the TCP peer is a trusted proxy.
    trust-forwarded-headers: ${TRUST_FORWARDED_HEADERS:false}
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
